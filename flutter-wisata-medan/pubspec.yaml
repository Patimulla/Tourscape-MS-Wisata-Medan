name: flutter_wisata_medan
description: SIG Wisata Kota Medan — Aplikasi Mobile GIS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # OpenStreetMap (flutter_map — no API key needed)
  flutter_map: ^7.0.2

  # Coordinate utilities (for OSRM routing)
  latlong2: ^0.9.1

  # GPS / Geolocation
  geolocator: ^10.1.0

  # HTTP Client
  http: ^1.1.0

  # Material Icons
  cupertino_icons: ^1.0.6
  image_picker: ^1.2.2
  supabase_flutter: ^2.12.4
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/boundaries/
